<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ef"/>
      <stop offset="100%" stop-color="#e8e3db"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8c0b5"/>
      <stop offset="100%" stop-color="#b5ada2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#ccc7be" opacity="0.6"/>
  </pattern>
  <rect width="800" height="480" fill="url(#dots)"/>

  <!-- Icon group centred at 400,220 -->
  <g transform="translate(400,215)">
    <!-- Outer frame of the image icon -->
    <rect x="-52" y="-44" width="104" height="88" rx="10" ry="10"
          fill="none" stroke="url(#iconGrad)" stroke-width="3.5" opacity="0.9"/>

    <!-- Mountains / landscape -->
    <polygon points="-32,28 -4,-10 24,28" fill="#c0b9b0" opacity="0.85"/>
    <polygon points="-4,-10 36,-22 40,28" fill="#b0a89e" opacity="0.85"/>

    <!-- Sun / circle -->
    <circle cx="22" cy="-22" r="11" fill="#c8c0b5" opacity="0.9"/>
  </g>

  <!-- Label -->
  <text x="400" y="296"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14"
        letter-spacing="1.5"
        fill="#a09890"
        opacity="0.9">IMAGE UNAVAILABLE</text>
</svg>
